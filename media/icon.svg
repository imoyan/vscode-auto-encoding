<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cardOrange1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="cardBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg1)"/>
  <rect x="23" y="23" width="466" height="466" rx="101" fill="none" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="6"/>

  <!-- Back card: G1 Orange + U+FFFD diamond '?' -->
  <rect x="74" y="76" width="232" height="196" rx="38" fill="url(#cardOrange1)"/>
  <rect x="142" y="126" width="96" height="96" rx="18" transform="rotate(45 190 174)" fill="#FFFFFF"/>
  <text x="190" y="202" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="84" fill="#EA580C">?</text>

  <!-- Clean swap arrows -->
  <path d="M 332 124 Q 402 124 402 192" fill="none" stroke="#64748B" stroke-width="20" stroke-linecap="round"/>
  <path d="M 378 176 L 402 206 L 426 176" fill="none" stroke="#64748B" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 180 390 Q 110 390 110 322" fill="none" stroke="#64748B" stroke-width="20" stroke-linecap="round"/>
  <path d="M 86 338 L 110 308 L 134 338" fill="none" stroke="#64748B" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front card: G1 Blue + CJK characters (あ / 漢 / 한) -->
  <rect x="196" y="228" width="248" height="212" rx="44" fill="#F1F5F9"/>
  <rect x="206" y="238" width="228" height="192" rx="38" fill="url(#cardBlue1)"/>

  <!-- Top row: あ (JP) + 한 (KR), Bottom: 漢 (CN/JP) or balanced triad -->
  <text x="272" y="328" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-weight="800" font-size="80" fill="#FFFFFF">あ</text>
  <text x="366" y="328" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-weight="800" font-size="78" fill="#BFDBFE">한</text>
  <text x="320" y="408" text-anchor="middle" font-family="Hiragino Sans, PingFang SC, sans-serif" font-weight="800" font-size="76" fill="#FFFFFF">漢</text>
</svg>
